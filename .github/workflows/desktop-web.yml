name: Desktop web engines
on:
    workflow_dispatch:
    pull_request:
        paths:
            [
                "src/**",
                "src-tauri/**",
                "static/**",
                "packaging/desktop-web/**",
                "bun.lock",
                "vite.config.ts",
                "scripts/desktop-web*",
                "scripts/lib/desktop-web*",
                "scripts/*msix*",
                "scripts/lib/desktop-msix.mjs",
                "desktop/tests/msix*",
                "tests/desktop-web*",
                "package.json",
                "svelte.config.js",
                ".github/workflows/desktop-web.yml",
            ]
    push:
        branches: [main]
        paths:
            [
                "src/**",
                "src-tauri/**",
                "static/**",
                "packaging/desktop-web/**",
                "bun.lock",
                "vite.config.ts",
                "scripts/desktop-web*",
                "scripts/lib/desktop-web*",
                "scripts/*msix*",
                "scripts/lib/desktop-msix.mjs",
                "desktop/tests/msix*",
                "tests/desktop-web*",
                "package.json",
                "svelte.config.js",
                ".github/workflows/desktop-web.yml",
            ]
permissions:
    contents: read
jobs:
    package:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          runner: ubuntu-24.04,
                          target: x86_64-unknown-linux-gnu,
                          bundles: deb,
                      }
                    - {
                          runner: ubuntu-24.04-arm,
                          target: aarch64-unknown-linux-gnu,
                          bundles: deb,
                      }
                    - {
                          runner: windows-2025,
                          target: x86_64-pc-windows-msvc,
                          bundles: nsis,
                      }
                    - {
                          runner: windows-11-arm,
                          target: aarch64-pc-windows-msvc,
                          bundles: nsis,
                      }
                    - {
                          runner: macos-15-intel,
                          target: x86_64-apple-darwin,
                          bundles: app,
                      }
                    - {
                          runner: macos-15,
                          target: aarch64-apple-darwin,
                          bundles: app,
                      }
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.22.2"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"
            - uses: dtolnay/rust-toolchain@stable
            - if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - run: bun install --frozen-lockfile
            - run: npm run i18n:compile
            - run: npm run desktop:check
            - run: npm test
            - if: runner.os == 'Linux'
              run: npm run desktop:test:sources
            - run: node --test desktop/tests/msix.test.mjs desktop/tests/store.test.mjs
            - run: npm run desktop:build
            - run: npm run desktop:test
            - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features store
            - if: matrix.target == 'x86_64-unknown-linux-gnu'
              run: bunx playwright install --with-deps chromium
            - if: matrix.target == 'x86_64-unknown-linux-gnu'
              run: npm run desktop:test:browser
            - run: npm run desktop:package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            - uses: actions/upload-artifact@v4
              with:
                  name: desktop-web-${{ matrix.target }}-unsigned
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/
                  if-no-files-found: error
                  retention-days: 14
