name: desktop-web-flatpak
# Builds the x64 flatpak bundle from the tauri deb payload. Dispatch-only:
# split from the packaging matrix so the long ARM64 job cannot block it.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    flatpak:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.22.2"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"
            - uses: dtolnay/rust-toolchain@stable
            - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils flatpak flatpak-builder
            - run: bun install --frozen-lockfile
            - run: npm run i18n:compile
            - name: Build the deb payload
              run: npm run desktop:package -- --config packaging/desktop-web/tauri.direct-download-ci.json --target x86_64-unknown-linux-gnu --bundles deb
            - name: Extract the deb payload
              shell: bash
              run: |
                  set -euo pipefail
                  # Resolve before cd: the find result is relative to the workspace.
                  deb=$(realpath "$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -name '*.deb' | head -1)")
                  mkdir -p packaging/flatpak/payload
                  cd packaging/flatpak/payload
                  ar x "$deb" data.tar.zst 2>/dev/null || ar x "$deb" data.tar.gz
                  tar -xf data.tar.*
            - name: Build the flatpak bundle
              shell: bash
              run: |
                  set -euo pipefail
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                  flatpak-builder --user --force-clean --repo=flatpak-repo build-dir packaging/flatpak/work.z8.desktop.yml
                  flatpak build-bundle flatpak-repo z8-work.flatpak work.z8.desktop
                  sha256sum z8-work.flatpak > SHA256SUMS
            - uses: actions/upload-artifact@v4
              with:
                  name: z8-work-flatpak
                  path: |
                      z8-work.flatpak
                      SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14
