name: Complete desktop preview packages
on:
    workflow_call:
        inputs:
            target:
                type: string
                default: macos
    workflow_dispatch:
        inputs:
            target:
                type: choice
                description: Complete package target
                default: macos
                options:
                    [
                        macos,
                        macos-arm64,
                        macos-amd64,
                        linux,
                        linux-arm64,
                        linux-amd64,
                    ]
permissions:
    contents: read
concurrency:
    group: complete-previews-${{ github.ref }}-${{ inputs.target }}
    cancel-in-progress: false
jobs:
    matrix:
        runs-on: ubuntu-24.04
        outputs:
            entries: ${{ steps.matrix.outputs.entries }}
        steps:
            - uses: actions/checkout@v4
            - id: matrix
              env:
                  TARGET: ${{ inputs.target }}
              run: |
                  entries=$(jq -c --arg target "$TARGET" '[.[] | select(.os == $target or .id == $target)]' packaging/desktop/ci-matrix.json)
                  echo "entries=$entries" >> "$GITHUB_OUTPUT"
    package:
        needs: matrix
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.matrix.outputs.entries) }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.22.2"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"
            - uses: dtolnay/rust-toolchain@1.96.0
              with:
                  targets: ${{ matrix.target }}
            - run: bun install --frozen-lockfile
            - run: bun run desktop:check
            - run: bun run desktop:build
            - if: runner.os == 'macOS'
              run: node scripts/desktop-ci-app.mjs ${{ matrix.id }}
            - name: Prepare native engine toolchain
              if: runner.os == 'macOS'
              run: brew install imagemagick ffmpeg mupdf-tools
            - name: Relocate engines, validate conversions and package DMG
              if: runner.os == 'macOS'
              run: node scripts/desktop-ci-macos-engines.mjs
            - if: runner.os == 'macOS'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.id }}-complete-preview
                  path: .desktop-local/mac-preview/downloads/*
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 14
            - if: always() && runner.os == 'macOS'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.id }}-complete-preview-reports
                  path: |
                      .desktop-local/ci/build-info.json
                      .desktop-local/ci/build-inputs.json
                      .desktop-local/mac-preview/*.json
                      .desktop-local/mac-preview/candidate/*.json
                  include-hidden-files: true
                  retention-days: 14

            - name: Install native Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config patchelf libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev python3 libfreetype-dev libgumbo-dev libharfbuzz-dev libjbig2dec0-dev libmujs-dev libopenjp2-7-dev zlib1g-dev libpng-dev libjpeg-dev libwebp-dev liblcms2-dev libheif-dev libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265 libheif-plugin-x265 ffmpeg pandoc pandoc-data squashfs-tools desktop-file-utils xvfb xauth dbus-x11 xdg-desktop-portal-gtk autoconf automake libtool libltdl-dev libxml2-dev patch dpkg-dev
                  sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/z8-im
            - if: matrix.id == 'linux-amd64'
              run: sudo snap install snapcraft --classic
            - name: Build native Linux engines, validate and package
              if: runner.os == 'Linux'
              run: bash scripts/desktop-ci-linux-packages.sh
            - if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.id }}-complete-preview
                  path: .desktop-local/linux-preview/downloads/*
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 14
            - if: always() && runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.id }}-complete-preview-reports
                  path: |
                      .desktop-local/linux-preview/*.log
                      .desktop-local/linux-preview/*.json
                      .desktop-local/linux-preview/build/*.log
                      .desktop-local/linux-preview/build/*.json
                      .desktop-local/linux-preview/candidate/*.json
                      .desktop-local/linux-preview/deb/*.json
                      .desktop-local/linux-preview/snap/*.json
                  include-hidden-files: true
                  retention-days: 14
