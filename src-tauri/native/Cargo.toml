[package]
name = "z8-native"
version = "0.1.0"
edition = "2021"
publish = false

[features]
development-engines = []
engine-validation = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
process-wrap = { version = "10", features = ["std"] }

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["development-engines"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[[bin]]
name = "bundle-check"
path = "src/bin/bundle-check.rs"
required-features = ["engine-validation"]

[[bin]]
name = "fault-check"
path = "src/bin/fault-check.rs"
required-features = ["engine-validation"]

[[bin]]
name = "validation-run"
path = "src/bin/validation-run.rs"
required-features = ["engine-validation"]
