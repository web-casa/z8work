[package]
name = "z8-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["native"]
resolver = "2"

[features]
default = ["gtk-dialog"]
gtk-dialog = ["tauri-plugin-dialog/gtk3"]
linux-portal = ["tauri-plugin-dialog/xdg-portal"]
packaged-engines = []
custom-protocol = ["tauri/custom-protocol"]
development-engines = ["z8-native/development-engines"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
z8-native = { path = "native" }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri already uses GTK. Message dialogs must not rely on a host zenity
# executable when file pickers use the portal backend (including strict Snap).
gtk = "=0.18.2"
