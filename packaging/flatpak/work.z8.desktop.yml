id: work.z8.desktop
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: z8-desktop
finish-args:
    - --share=ipc
    - --socket=fallback-x11
    - --socket=wayland
    - --device=dri
    - --socket=pulseaudio
    - --filesystem=home
    - --talk-name=org.freedesktop.portal.Desktop
modules:
    - name: z8-work
      buildsystem: simple
      sources:
          - type: dir
            path: payload/usr
      build-commands:
          - install -Dm755 bin/z8-desktop /app/bin/z8-desktop
          - mkdir -p /app/lib
          - cp -r lib/. /app/lib/
