id: work.z8.desktop
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: z8-desktop
finish-args:
    - --share=ipc
    - --socket=fallback-x11
    - --socket=wayland
    - --device=dri
    - --socket=pulseaudio
    - --filesystem=home
modules:
    - name: z8-work
      buildsystem: simple
      sources:
          - type: dir
            path: payload/usr
      build-commands:
          - install -Dm755 bin/z8-desktop /app/bin/z8-desktop
          - install -Dm644 share/applications/Z8.Work.desktop /app/share/applications/work.z8.desktop.desktop
          - sed -i 's|^Icon=.*|Icon=work.z8.desktop|' /app/share/applications/work.z8.desktop.desktop
          - >-
              install -Dm644 share/icons/hicolor/192x192/apps/z8-desktop.png
              /app/share/icons/hicolor/192x192/apps/work.z8.desktop.png
